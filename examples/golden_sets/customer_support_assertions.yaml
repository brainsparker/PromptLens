name: "Customer Support Evaluation (Deterministic Assertions)"
description: >
  The customer support golden set with deterministic assertions added.
  Assertions run without an LLM judge, cost nothing, and return the same
  result every time, which makes them safe to gate a CI build on.
version: "1.0"

test_cases:
  - id: "cs-001"
    query: "How do I reset my password?"
    expected_behavior: "Provide clear step-by-step instructions for password reset, including where to find the reset link"
    category: "account_management"
    tags: ["password", "account", "security"]
    assertions:
      - type: contains
        value: "reset"
        case_sensitive: false
      - type: regex
        value: "(forgot|reset) (your )?password"
        case_sensitive: false
        name: "mentions the reset link flow"
      - type: not_contains
        value: "I don't know"
        case_sensitive: false
      - type: max_length
        value: 1500

  - id: "cs-002"
    query: "What's your refund policy?"
    expected_behavior: "Explain the 30-day refund policy clearly, including conditions and the process to request a refund"
    category: "policy"
    tags: ["refund", "policy", "billing"]
    reference_answer: "Refunds are accepted within 30 days of purchase. Contact support with your order number to request one."
    assertions:
      - type: contains
        value: "30"
        name: "states the 30 day window"
      - type: not_regex
        value: "\\b(60|90) days\\b"
        name: "does not invent a different window"
      - type: token_f1
        threshold: 0.35
        name: "overlaps the reference policy text"

  - id: "cs-003"
    query: "My order hasn't arrived yet. What should I do?"
    expected_behavior: "Ask for order number, provide tracking information lookup process, and offer resolution options"
    category: "shipping"
    tags: ["shipping", "tracking", "order"]
    assertions:
      - type: contains
        value: "order number"
        case_sensitive: false
      - type: contains
        value: "track"
        case_sensitive: false

  - id: "cs-006"
    query: "Return the current plan limits as JSON with keys plan, seats, and storage_gb."
    expected_behavior: "Respond with a single valid JSON object using exactly the requested keys"
    category: "structured_output"
    tags: ["json", "format"]
    assertions:
      - type: is_json
      - type: regex
        value: "\"plan\"\\s*:"
      - type: regex
        value: "\"seats\"\\s*:"
      - type: regex
        value: "\"storage_gb\"\\s*:"
